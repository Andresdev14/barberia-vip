<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central de Prospectos · Barranquilla</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #09090b;
      --surface: #111114;
      --surface-2: #18181c;
      --text: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --accent: #fafafa;
      --accent-ink: #09090b;
      --green: #10b981;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-block-size: 100dvh;
      padding: 18px 16px 64px;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    .container {
      max-inline-size: 620px;
      margin-inline: auto;
    }

    .header-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-block-end: 14px;
    }
    .header-card h1 {
      font-size: 1.18rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-block-end: 4px;
    }
    .header-card p {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-block-end: 16px;
    }

    /* Niche Tabs */
    .niche-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--bg);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      margin-block-end: 14px;
    }
    .niche-tab {
      min-block-size: 40px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.16s;
    }
    .niche-tab.active {
      background: var(--text);
      color: var(--bg);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding-block-end: 14px;
      border-block-end: 1px solid var(--border);
      margin-block-end: 12px;
    }
    .stat-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 10px;
    }
    .stat-box strong {
      display: block;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .stat-box span {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .price-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    .price-bar select {
      min-block-size: 38px;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Collapsible Quick Add (content-first-noise-reduction) */
    details.add-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 15px;
      margin-block-end: 14px;
    }
    details.add-panel summary {
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-secondary);
    }
    .add-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-block-start: 12px;
    }
    .add-form .full { grid-column: 1 / -1; }
    .add-form input {
      inline-size: 100%;
      min-block-size: 42px;
      padding: 8px 11px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: max(1rem, 1em);
    }
    .btn-save {
      grid-column: 1 / -1;
      min-block-size: 42px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--text);
      color: var(--bg);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Lead Cards */
    .leads-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .lead-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 15px;
      transition: border-color 0.16s;
    }
    .lead-card.sent {
      border-color: rgba(16, 185, 129, 0.45);
    }
    .lead-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-block-end: 4px;
    }
    .lead-title {
      font-size: 0.94rem;
      font-weight: 600;
    }
    .lead-badge {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .lead-card.sent .lead-badge {
      background: rgba(16, 185, 129, 0.16);
      color: #34d399;
    }
    .lead-info {
      font-size: 0.79rem;
      color: var(--text-secondary);
      margin-block-end: 12px;
    }

    .primary-actions {
      display: grid;
      grid-template-columns: 1fr 1.45fr;
      gap: 8px;
    }
    .btn {
      min-block-size: 42px;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-outline {
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      color: var(--text);
    }
    .btn-wa {
      border: none;
      background: #25d366;
      color: #05180c;
    }

    .secondary-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-block-start: 8px;
    }
    .link-mini {
      min-block-size: 32px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header-card">
      <h1>Central Multi-Nicho · Barranquilla</h1>
      <p>Demos minimalistas listas para mostrar y enviar en un toque para Barberías, Restaurantes y Salones de Belleza.</p>

      <div class="niche-tabs" role="tablist" aria-label="Verticales de negocio">
        <button type="button" class="niche-tab active" id="tab_barberia" onclick="switchNiche('barberia')">Barberías</button>
        <button type="button" class="niche-tab" id="tab_restaurante" onclick="switchNiche('restaurante')">Restaurantes</button>
        <button type="button" class="niche-tab" id="tab_estilista" onclick="switchNiche('estilista')">Estilistas</button>
      </div>

      <div class="stats-grid">
        <div class="stat-box"><strong class="mono" id="stTotal">0</strong><span>Prospectos</span></div>
        <div class="stat-box"><strong class="mono" id="stSent">0</strong><span>Contactados</span></div>
        <div class="stat-box"><strong class="mono" id="stPending">0</strong><span>Pendientes</span></div>
      </div>

      <div class="price-bar">
        <label for="offerPrice">Oferta en el mensaje:</label>
        <select id="offerPrice" onchange="render()">
          <option value="$150.000 COP">$150.000 COP</option>
          <option value="$180.000 COP" selected>$180.000 COP</option>
          <option value="$220.000 COP">$220.000 COP</option>
        </select>
      </div>
    </header>

    <details class="add-panel">
      <summary>+ Agregar nuevo negocio al nicho actual</summary>
      <div class="add-form">
        <input class="full" type="text" id="newName" placeholder="Nombre comercial del negocio" />
        <input type="text" id="newLoc" placeholder="Sector / Dirección" />
        <input type="tel" id="newPhone" placeholder="WhatsApp (ej. 3001234567)" />
        <button type="button" class="btn-save" onclick="addLead()">Guardar prospecto</button>
      </div>
    </details>

    <main class="leads-stack" id="leadsStack"></main>
  </div>

  <script>
    const CATALOG = {
      barberia: {
        page: "",
        leads: [
          { id: "b1", name: "OG23 Barber Studio", loc: "El Prado · Calle 70 # 53-52", phone: "573163947170", tag: "Fresha Verificado", theme: "crimson" },
          { id: "b2", name: "The Boogeyman Barber Shop", loc: "Norte · Cra. 46 # 79-163 Local 2", phone: "573126083686", tag: "WhatsApp Oficial", theme: "gold" },
          { id: "b3", name: "Priority Barber", loc: "Plaza 87 · Cra. 46 # 85-185", phone: "573011654620", tag: "WeiBook Verificado", theme: "crimson" },
          { id: "b4", name: "Champions Barber Shop", loc: "El Recreo · Calle 57 # 37-83", phone: "573017661708", tag: "AgendaPro Verificado", theme: "gold" },
          { id: "b5", name: "Barbas & Bigotes (Parque Venezuela)", loc: "Parque Venezuela · Calle 88 # 44-10", phone: "573004097624", tag: "Línea Oficial", theme: "gold" },
          { id: "b6", name: "Barbas & Bigotes (Plaza de la Paz)", loc: "Plaza de la Paz · Cra. 45 # 50-168", phone: "573006734799", tag: "Línea Oficial", theme: "gold" },
          { id: "b7", name: "La Barba VIP (Villa Carolina)", loc: "Villa Carolina · Cra. 65 # 91-05", phone: "573002979720", tag: "Línea Oficial", theme: "gold" },
          { id: "b8", name: "La Barba VIP (Riomar)", loc: "Riomar · Cra. 65 # 86-191", phone: "573007633755", tag: "Línea Oficial", theme: "crimson" },
          { id: "b9", name: "Don Bigotes Barberías", loc: "Norte · Sede Plaza del Parque", phone: "573022461401", tag: "Línea Oficial", theme: "emerald" },
          { id: "b10", name: "La Barbería Servicio Superior", loc: "Alto Prado · Cra. 50 # 76-82", phone: "573228309938", tag: "Fresha Verificado", theme: "gold" },
          { id: "b11", name: "Frank Jr Barber", loc: "Norte · Calle 120 # 42-112", phone: "573012936439", tag: "WeiBook Verificado", theme: "crimson" },
          { id: "b12", name: "Headmasters Barbería", loc: "Alto Prado · Calle 84 # 53-46", phone: "573112604509", tag: "Alto Prado", theme: "emerald" },
          { id: "b13", name: "Bárbaros Barber Shop", loc: "Norte · Cra. 45 # 85-94", phone: "573005265659", tag: "Norte", theme: "gold" },
          { id: "b14", name: "Caracas Barbershop", loc: "Villa Carolina · Cra. 73 # 88-12", phone: "573014059061", tag: "Villa Carolina", theme: "crimson" },
          { id: "b15", name: "Niche Barber Shop", loc: "Las Delicias · Calle 72 # 41B-27", phone: "573005462572", tag: "Las Delicias", theme: "gold" }
        ]
      },
      restaurante: {
        page: "restaurante.html",
        leads: [
          { id: "r1", name: "Kobe Sushi & Burger", loc: "Norte · Calle 96 # 46-30", phone: "573242218119", tag: "Sushi & Burgers", theme: "orange" },
          { id: "r2", name: "Punto Loco (Villa Carolina)", loc: "Villa Carolina · Cra. 75A con Calle 86", phone: "573004075340", tag: "Línea Domicilios", theme: "crimson" },
          { id: "r3", name: "Punto Loco (Calle 85)", loc: "Norte · Calle 85", phone: "573234143272", tag: "Línea Domicilios", theme: "orange" },
          { id: "r4", name: "Punto Loco (Alameda del Río)", loc: "Alameda del Río · Barranquilla", phone: "573042713121", tag: "Línea Domicilios", theme: "orange" },
          { id: "r5", name: "Punto Loco (Villa Campestre)", loc: "Villa Campestre · Norte", phone: "573023550015", tag: "Línea Domicilios", theme: "emerald" },
          { id: "r6", name: "Monster Jey Food", loc: "Barranquilla · Comidas Rápidas", phone: "573006057216", tag: "Fast Food", theme: "crimson" },
          { id: "r7", name: "El Chuzales", loc: "Barranquilla · Asados & Chuzos", phone: "573013639609", tag: "Parrilla", theme: "orange" },
          { id: "r8", name: "Pizzería Parmesana", loc: "Villa Carolina · Calle 88 # 75-26", phone: "573015609564", tag: "Pizzería", theme: "emerald" },
          { id: "r9", name: "La Diva Pizzería", loc: "Barranquilla · Pizza Artesanal", phone: "573108334901", tag: "Pizzería", theme: "crimson" },
          { id: "r10", name: "Pollo Don Rito", loc: "Las Delicias · Cra. 38 # 71-96", phone: "573017524149", tag: "Restaurante", theme: "orange" }
        ]
      },
      estilista: {
        page: "estilistas.html",
        leads: [
          { id: "e1", name: "Elena Beauty Spa & Nails", loc: "Alto Prado · Calle 92 # 51C-30 Local 2", phone: "573046382036", tag: "AgendaPro Verificado", theme: "rose" },
          { id: "e2", name: "Claudia Chacón Salas de Belleza", loc: "Altos del Prado · Cra. 56 # 75-155", phone: "573213166537", tag: "Línea Citas Oficial", theme: "noir" },
          { id: "e3", name: "Siempre Bella Salón Boutique", loc: "Alto Prado · Calle 82 # 51B-12", phone: "573023154559", tag: "Uñas & Estilismo", theme: "rose" },
          { id: "e4", name: "Bellísima Spa & Salón", loc: "Norte · Calle 92 # 46-218", phone: "573013726576", tag: "Spa & Cabello", theme: "sage" },
          { id: "e5", name: "Arte y Estilo (Olga Cervera)", loc: "Norte · Cra. 42H # 85-57", phone: "573004035352", tag: "Peluquería", theme: "rose" },
          { id: "e6", name: "Cenith Movilla Sala de Belleza", loc: "El Prado / Boston · Calle 53 # 43-17", phone: "573045855503", tag: "Estética", theme: "noir" }
        ]
      }
    };

    let activeNiche = "barberia";

    const getStore = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) || def; } catch { return def; } };
    const setStore = (k, v) => localStorage.setItem(k, JSON.stringify(v));

    function switchNiche(n) {
      activeNiche = n;
      ["barberia", "restaurante", "estilista"].forEach(k => {
        document.getElementById("tab_" + k).classList.toggle("active", k === n);
      });
      render();
    }

    function getLeadsForNiche(n) {
      const custom = getStore("custom_leads_" + n, []);
      const overrides = getStore("phone_overrides_v2", {});
      return [...custom, ...CATALOG[n].leads].map(l => overrides[l.id] ? { ...l, phone: overrides[l.id] } : l);
    }

    function addLead() {
      const name = document.getElementById("newName").value.trim();
      const loc = document.getElementById("newLoc").value.trim() || "Barranquilla";
      let ph = document.getElementById("newPhone").value.replace(/\D/g, "");
      if (!name || !ph) return;
      if (!ph.startsWith("57")) ph = "57" + ph;
      const list = getStore("custom_leads_" + activeNiche, []);
      list.unshift({ id: "c_" + Date.now(), name, loc, phone: ph, tag: "Agregado", theme: activeNiche === "estilista" ? "rose" : "gold" });
      setStore("custom_leads_" + activeNiche, list);
      document.getElementById("newName").value = "";
      document.getElementById("newLoc").value = "";
      document.getElementById("newPhone").value = "";
      render();
    }

    function editPhone(id) {
      const lead = getLeadsForNiche(activeNiche).find(x => x.id === id);
      if (!lead) return;
      const next = prompt(`Actualizar WhatsApp de ${lead.name}:`, lead.phone.replace(/^57/, ""));
      if (!next) return;
      let clean = next.replace(/\D/g, "");
      if (!clean) return;
      if (!clean.startsWith("57")) clean = "57" + clean;
      const ov = getStore("phone_overrides_v2", {});
      ov[id] = clean;
      setStore("phone_overrides_v2", ov);
      render();
    }

    function buildDemoLink(lead) {
      const baseDir = window.location.origin + window.location.pathname.replace(/prospectos\.html$/, "");
      const page = CATALOG[activeNiche].page;
      const p = new URLSearchParams({ nombre: lead.name, barrio: lead.loc, wa: lead.phone, tema: lead.theme });
      return `${baseDir}${page}?${p.toString()}`;
    }

    function buildPitch(lead, demoUrl, price) {
      if (activeNiche === "restaurante") {
        return `Hola equipo de *${lead.name}*, ¿cómo están? Soy Andrés, desarrollador web en Barranquilla.\n\nLes preparé una demo minimalista de su propio *Menú Digital con Pedidos a WhatsApp* (incluye personalización de adiciones, cálculo automático de domicilio/recoger y panel de cocina para marcar platos agotados, sin pagar comisiones por pedido):\n\n${demoUrl}\n\nPruébenla desde el celular. Si les gusta cómo funciona, se las dejo 100% configurada con toda su carta y fotos reales por ${price} (pago único, sin mensualidades). ¿Qué les parece?`;
      }
      if (activeNiche === "estilista") {
        return `Hola equipo de *${lead.name}*, ¿cómo están? Soy Andrés, desarrollador web en Barranquilla.\n\nLes diseñé una demo minimalista de *Agenda Online para Salón & Estilistas* con el nombre de *${lead.name}* (incluye selección de especialista, bloqueo automático de bloques ocupados y separación con anticipo Nequi anti-inasistencias):\n\n${demoUrl}\n\nPruébenla aquí desde el celular. Si les gusta el diseño, se las entrego personalizada con todos sus servicios y equipo por ${price} (pago único, sin mensualidades). ¿Les gustaría implementarla?`;
      }
      return `Hola equipo de *${lead.name}*, ¿cómo están? Soy Andrés, desarrollador web en Barranquilla.\n\nLes diseñé una demo minimalista de *Reservas Online* con el nombre de *${lead.name}* (incluye bloqueo automático de horas ocupadas por barbero y protección anti-inasistencias con anticipo Nequi o liberación en un toque):\n\n${demoUrl}\n\nPruébenla desde el celular. Si les gusta cómo funciona, se las dejo personalizada con sus precios y barberos reales por ${price} (pago único, sin mensualidades). ¿Qué les parece?`;
    }

    function sendWa(id) {
      const lead = getLeadsForNiche(activeNiche).find(x => x.id === id);
      if (!lead) return;
      const price = document.getElementById("offerPrice").value;
      const url = buildDemoLink(lead);
      const msg = buildPitch(lead, url, price);
      const sent = getStore("barber_sent_leads", {});
      sent[id] = true;
      setStore("barber_sent_leads", sent);
      render();
      window.open(`https://wa.me/${lead.phone}?text=${encodeURIComponent(msg)}`, "_blank");
    }

    function toggleSent(id) {
      const sent = getStore("barber_sent_leads", {});
      if (sent[id]) delete sent[id]; else sent[id] = true;
      setStore("barber_sent_leads", sent);
      render();
    }

    function render() {
      const list = getLeadsForNiche(activeNiche);
      const sent = getStore("barber_sent_leads", {});
      const sCount = list.filter(l => sent[l.id]).length;
      document.getElementById("stTotal").textContent = String(list.length);
      document.getElementById("stSent").textContent = String(sCount);
      document.getElementById("stPending").textContent = String(list.length - sCount);

      document.getElementById("leadsStack").innerHTML = list.map((l, i) => {
        const isSent = !!sent[l.id];
        const demoUrl = buildDemoLink(l);
        const dispPh = l.phone.replace(/^57(\d{3})(\d{3})(\d{4})$/, "+57 $1 $2 $3");
        const igQuery = encodeURIComponent(`${l.name} Barranquilla Instagram`);
        return `
          <article class="lead-card ${isSent ? 'sent' : ''}">
            <div class="lead-head">
              <div class="lead-title">${i + 1}. ${l.name}</div>
              <span class="lead-badge">${isSent ? 'Contactado' : l.tag}</span>
            </div>
            <div class="lead-info">
              <div>${l.loc}</div>
              <div class="mono" style="font-size:0.75rem;margin-block-start:2px;">${dispPh}</div>
            </div>
            <div class="primary-actions">
              <a class="btn btn-outline" href="${demoUrl}" target="_blank">Ver demo</a>
              <button type="button" class="btn btn-wa" onclick="sendWa('${l.id}')">${isSent ? 'Reenviar WhatsApp' : 'Enviar WhatsApp'}</button>
            </div>
            <div class="secondary-actions">
              <button type="button" class="link-mini" onclick="editPhone('${l.id}')">Cambiar número</button>
              <a class="link-mini" href="https://www.google.com/search?q=${igQuery}" target="_blank">Buscar Instagram</a>
              <button type="button" class="link-mini" onclick="toggleSent('${l.id}')">${isSent ? 'Marcar pendiente' : 'Marcar enviado'}</button>
            </div>
          </article>
        `;
      }).join("");
    }

    render();
  </script>
</body>
</html>
